{% extends "base.html" %}{% block body %}
<h1>Vender</h1>
<div class="mostrador">
  <section>
    <div class="buscar"><input id="q" placeholder="Busca un producto, o escanea el código y presiona Enter" autocomplete="off" autofocus aria-label="Buscar producto"></div>
    <div class="chips" id="chips" role="group" aria-label="Categorías"></div>
    <div class="tiles" id="tiles"></div>
  </section>
  <aside>
    <div class="tiquete">
      <h2>Venta nueva</h2>
      <ul class="lineas" id="lineas"></ul>
      <div class="tot" id="total">$ 0</div>
      <div class="pago" role="radiogroup" aria-label="Forma de pago">
        <label><input type="radio" name="pago" value="efectivo" checked><span>Efectivo</span></label>
        <label><input type="radio" name="pago" value="credito"><span>Fiado</span></label>
      </div>
      <div id="cli" hidden><label for="cliente">Cliente</label>
        <select id="cliente" style="width:100%"><option value="">Elige un cliente</option>{% for c in clientes %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}</select></div>
      <p id="err" class="warn" role="alert"></p>
      <button class="cobrar" id="cobrar" type="button">Cobrar</button>
    </div>
  </aside>
</div>
<script>
const P = {{ productos|tojson }}, ADMIN = {{ 'true' if session.rol == 'admin' else 'false' }};
let cart = [], cat = '';
const $ = id => document.getElementById(id);
const fmt = v => '$ ' + Math.round(v).toLocaleString('es-CO');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cats = [...new Set(P.map(p => p.categoria).filter(Boolean))].sort();

function chips() {
  $('chips').innerHTML = ['', ...cats].map(c => `<button type="button" class="chip${c === cat ? ' on' : ''}" data-cat="${esc(c)}" aria-pressed="${c === cat}">${c ? esc(c) : 'Todo'}</button>`).join('');
}
function visibles() {
  const t = $('q').value.toLowerCase().trim();
  return P.filter(p => (!cat || p.categoria === cat) && (!t || p.nombre.toLowerCase().includes(t) || (p.codigo || '').toLowerCase() === t));
}
function tiles() {
  const v = visibles();
  $('tiles').innerHTML = v.slice(0, 60).map(p => {
    const prod = p.tipo === 'producto', agot = prod && p.stock <= 0, bajo = prod && p.stock <= p.stock_minimo;
    return `<button type="button" class="tile${bajo ? ' bajo' : ''}" data-id="${p.id}"${agot ? ' disabled' : ''}>
      <span>${esc(p.nombre)}</span><small>${prod ? (agot ? 'agotado' : 'quedan ' + p.stock) : 'servicio'}</small><span class="precio">${fmt(p.precio)}</span></button>`;
  }).join('') || '<p class="suave">No hay productos con ese nombre. Revisa la búsqueda o la categoría.</p>';
}
function agregar(id) {
  const p = P.find(x => x.id == id); if (!p) return;
  const l = cart.find(c => c.id == id);
  if (l) l.cantidad++; else cart.push({id: p.id, nombre: p.nombre, precio: p.precio, cantidad: 1});
  $('q').value = ''; $('q').focus(); tiles(); lineas();
}
function lineas() {
  let tot = 0;
  $('lineas').innerHTML = cart.map((l, i) => { tot += l.cantidad * l.precio; return `<li>
    <div class="nom">${esc(l.nombre)}<small>${ADMIN ? `<input class="pre" data-i="${i}" type="number" min="0" step="any" value="${l.precio}" style="width:6rem;padding:.15rem .3rem" aria-label="Precio de ${esc(l.nombre)}">` : fmt(l.precio)}</small></div>
    <div class="paso"><button type="button" data-act="menos" data-i="${i}" aria-label="Quitar uno">−</button><input class="cant" data-i="${i}" type="number" min="0.01" step="any" value="${l.cantidad}" aria-label="Cantidad"><button type="button" data-act="mas" data-i="${i}" aria-label="Agregar uno">+</button></div>
    <span class="sub">${fmt(l.cantidad * l.precio)}</span></li>`; }).join('') || '<li class="vacio">Toca un producto para agregarlo.</li>';
  $('total').textContent = fmt(tot);
}
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) { cat = b.dataset.cat; chips(); tiles(); } });
$('tiles').addEventListener('click', e => { const b = e.target.closest('.tile'); if (b && !b.disabled) agregar(b.dataset.id); });
$('lineas').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const l = cart[b.dataset.i];
  if (b.dataset.act === 'mas') l.cantidad++;
  else if (--l.cantidad <= 0) cart.splice(b.dataset.i, 1);
  lineas();
});
$('lineas').addEventListener('change', e => {
  const i = e.target.dataset.i; if (i === undefined) return;
  const v = parseFloat(e.target.value);
  if (e.target.classList.contains('cant')) { if (v > 0) cart[i].cantidad = v; else cart.splice(i, 1); } else cart[i].precio = v >= 0 ? v : cart[i].precio;
  lineas();
});
$('q').addEventListener('input', tiles);
$('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; e.preventDefault();
  const t = $('q').value.trim().toLowerCase();
  const p = P.find(x => (x.codigo || '').toLowerCase() === t && t) || visibles().find(x => x.tipo !== 'producto' || x.stock > 0);
  if (p) agregar(p.id);
});
document.querySelectorAll('input[name=pago]').forEach(r => r.addEventListener('change', () => { $('cli').hidden = document.querySelector('input[name=pago]:checked').value !== 'credito'; }));
$('cobrar').addEventListener('click', async () => {
  $('err').textContent = '';
  const r = await fetch('{{ url_for("venta_guardar") }}', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({metodo: document.querySelector('input[name=pago]:checked').value, cliente_id: $('cliente').value,
      items: cart.map(l => ({id: l.id, cantidad: l.cantidad, precio: l.precio}))})});
  const d = await r.json();
  if (d.ok) location = d.url; else $('err').textContent = d.error || 'No se pudo registrar la venta.';
});
chips(); tiles(); lineas();
</script>
{% endblock %}
