{% extends "base.html" %}{% block title %}Ingresar · {{ tienda }}{% endblock %}
{% block portada %}
<div class="portada">
  <h1>{{ tienda }}</h1>
  <form method="post" class="etiqueta">
    {% for cat, m in get_flashed_messages(with_categories=true) %}<div class="msg {{ cat }}" role="alert">{{ m }}</div>{% endfor %}
    <label for="usuario">Usuario</label><input id="usuario" name="usuario" required autofocus autocomplete="username">
    <label for="clave">Contraseña</label><input id="clave" name="clave" type="password" required autocomplete="current-password">
    <button>Entrar</button>
  </form>
</div>
{% endblock %}
